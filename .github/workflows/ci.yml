name: Verify Android and Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - if: runner.os == 'Linux'
        run: flutter build apk --debug
      - if: runner.os == 'Windows'
        run: flutter build windows --release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-setup
          path: dist/*.exe
